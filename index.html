<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSUK Sales Hub</title><style>
:root{font-family:Inter,system-ui,Arial;color:#eaf0f9;background:#0b1424}*{box-sizing:border-box}body{margin:0}header{background:#111e33;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:22px;margin:0}h2{font-size:19px}main{max-width:1180px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}button{cursor:pointer;border:1px solid #35445a;border-radius:8px;padding:10px 13px;background:#20334d;color:white}button.primary{background:#2563eb;border-color:#2563eb}button:hover{filter:brightness(1.15)}input,select,textarea{background:#101e31;color:white;border:1px solid #46566c;border-radius:7px;padding:10px;width:100%;font:inherit}textarea{min-height:90px}label{display:block;font-size:12px;color:#b4c6dd;margin:10px 0 5px}.card{background:#14243a;border:1px solid #314258;border-radius:12px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:29px;font-weight:800}.muted{color:#a7b9cd;font-size:13px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.item{border-top:1px solid #34455a;padding:12px 0}.item:first-child{border:0}.pill{font-size:12px;border-radius:20px;padding:4px 9px;background:#2d425e}.hidden{display:none!important}.error{color:#ffb0b0}.success{color:#9be3bb}dialog{background:#14243a;color:white;border:1px solid #40536a;border-radius:12px;width:min(600px,95vw)}dialog::backdrop{background:#0009}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #30425b}a{color:#9ec4ff}#status{font-size:13px;margin:10px 0}
 .pipeline-board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding:8px 0 20px}.pipeline-column{flex:0 0 255px;max-height:70vh;overflow-y:auto;background:#101e31;border:1px solid #314258;border-radius:10px;padding:12px}.pipeline-column h3{font-size:15px;margin:4px 0 12px}.pipeline-card{background:#1a2b43;border:1px solid #40516a;border-radius:9px;padding:12px;margin:10px 0}.pipeline-card p{margin:8px 0}.pipeline-stage{font-size:12px;padding:8px}

:root{color-scheme:light;font-family:Inter,system-ui,Arial;color:#17221b;background:#f5f8f3}body{background:#f5f8f3;color:#17221b}header{background:#fff;border-bottom:4px solid #76c853;padding:12px 4%;box-shadow:0 3px 14px #16351b0c}header .muted{color:#537050}header h1{color:#111}main{max-width:1320px}nav{gap:9px;margin:22px 0}button{background:#fff;color:#253529;border:1px solid #cbd9c8;font-weight:650;transition:background .15s,border-color .15s,transform .15s}button:hover{background:#e9f7e3;border-color:#75c754;filter:none}button.primary{background:#72c653;border-color:#72c653;color:#101c12}button.primary:hover{background:#5db43d}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #82d564;outline-offset:2px}input,select,textarea{background:#fff;color:#1a2b1e;border-color:#c5d4c3}label{color:#46624c}.card{background:#fff;border:1px solid #dce7d8;box-shadow:0 4px 20px #1b35150a;border-radius:14px}.stat{color:#327d2d}.muted{color:#617568}.item{border-color:#e0e9dd}.pill{background:#e3f4dc;color:#27652d}dialog{background:#fff;color:#17221b;border:1px solid #c8ddc4;box-shadow:0 16px 55px #17291b2e}dialog::backdrop{background:#13261e91}td,th{border-color:#e1e9dd}a{color:#267b35}.pipeline-column{background:#eef5eb;border-color:#d6e5d0}.pipeline-card{background:#fff;border-color:#d4e4cf;box-shadow:0 3px 10px #214f1710}.pipeline-column h3{color:#235d2b}.pipeline-stage{background:#fff}#login{max-width:520px;margin:48px auto;padding:28px}#login h2{font-size:25px}#status{font-weight:600}.brand-wrap{display:flex;align-items:center;gap:18px}.brand-logo{width:210px;max-width:44vw;height:auto;display:block}.brand-caption{border-left:2px solid #c9e4bf;padding-left:15px}.brand-caption h1{font-size:23px;letter-spacing:-.5px}.brand-caption .muted{font-size:12px}@media(max-width:640px){header{padding:13px 4%}.brand-wrap{gap:9px}.brand-logo{width:130px}.brand-caption{padding-left:9px}.brand-caption h1{font-size:17px}.brand-caption .muted{font-size:10px}main{padding:12px}.card{padding:14px}}
[hidden]{display:none!important}</style></head><body><header><div class="brand-wrap"><img class="brand-logo" src="/rsuk-brand.svg" alt="RSUK — Scaffolds of Distinction"><div class="brand-caption"><h1>Sales Hub</h1><div class="muted">Coventry & Birmingham · Team CRM</div></div></div><button id="logout" class="hidden">Sign out</button></header><main><section id="login" class="card"><h2>Team sign in</h2><p class="muted">Only invited, approved RSUK team members can access records.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div class="row" style="margin-top:12px"><button class="primary" id="signin">Sign in</button><button id="reset">Send password reset</button></div><p id="loginmsg" class="muted"></p></section><section id="app" class="hidden"><nav id="nav"></nav><div id="status"></div><div id="content"></div></section></main><dialog id="modal"><div id="modalcontent"></div><div class="row" style="margin-top:14px"><button onclick="document.getElementById('modal').close()">Close</button></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script src="/sales-agents.js"></script><script>
(()=>{'use strict';const cfg=window.RSUK_CONFIG||{};const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sectors=['Tier 1 construction','Social housing / planned maintenance','Industrial / power stations','Pharmaceutical / manufacturing','Roofing / solar','Facilities management'];const stages=['Not contacted','Contacted','Interested','Meeting booked','Approved supplier','Quote submitted','First order won','Not suitable'];let sb,session,memberRole='staff',tab='Dashboard',companies=[],contacts=[],activities=[],campaigns=[],recipients=[];const fmt=n=>'£'+Number(n||0).toLocaleString('en-GB');const date=()=>new Date().toISOString().slice(0,10);const notice=(m,bad=false)=>{$('status').textContent=m;$('status').className=bad?'error':'success'};const option=(arr,val)=>arr.map(s=>`<option value="${escape(s)}" ${s===val?'selected':''}>${escape(s)}</option>`).join('');const companyById=id=>companies.find(c=>c.id===id);const coOptions=()=>companies.map(c=>`<option value="${c.id}">${escape(c.name)}</option>`).join('');const btn=(text,act)=>`<button data-act="${act}">${escape(text)}</button>`;
if(!cfg.url||!cfg.anonKey||!window.supabase){$('loginmsg').textContent='Deployment configuration missing. Follow README.md to configure Supabase.';return}sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
async function load(){const names=['companies','contacts','activities','campaigns','campaign_recipients'];const res=await Promise.all(names.map(n=>{const q=sb.from(n).select('*').limit(5000);return n==='activities'?q.neq('action','sales_outlook_connection'):q}));const bad=res.find(x=>x.error);if(bad)throw bad.error;[companies,contacts,activities,campaigns,recipients]=res.map(x=>x.data||[]);render()}
async function auth(){let {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return}const {data:member,error}=await sb.from('team_members').select('role,active').eq('user_id',s.user.id).maybeSingle();if(error||!member?.active){await sb.auth.signOut();$('loginmsg').textContent='Your account is not yet approved by the RSUK administrator.';return auth()}memberRole=member.role;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');try{await load()}catch(e){notice(e.message,true)}}
$('signin').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginmsg').textContent=error?.message||'';if(!error)await auth()};$('reset').onclick=async()=>{const {error}=await sb.auth.resetPasswordForEmail($('email').value,{redirectTo:location.origin});$('loginmsg').textContent=error?.message||'If the account exists, a reset email has been sent.'};$('logout').onclick=async()=>{await sb.auth.signOut();await auth()};sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')auth()});
function render(){const tabs=['Dashboard','Companies','Contacts','Pipeline','Follow-ups','Campaigns','Find Customers','Sales Assistants','Import / Export'];if(memberRole==='admin')tabs.push('Team');$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'primary':''}" data-tab="${t}">${t}</button>`).join('');const el=$('content');if(tab==='Dashboard'){let due=companies.filter(c=>c.next_contact&&c.next_contact<=date()&&!['First order won','Not suitable'].includes(c.stage));el.innerHTML=`<div class="grid">${[['Companies',companies.length],['Contacts',contacts.length],['Follow-ups due',due.length],['First orders',companies.filter(c=>c.stage==='First order won').length],['Opportunity value',fmt(companies.reduce((s,c)=>s+Number(c.value||0),0))]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="stat">${b}</div></div>`).join('')}</div><div class="card"><h2>Follow-ups due</h2>${due.map(c=>`<div class="item">${escape(c.name)} · ${escape(c.next_contact)} ${btn('Open','company:'+c.id)}</div>`).join('')||'<p class="muted">Nothing due.</p>'}</div>`}
else if(tab==='Sales Assistants'){window.RSUKSalesAgents.mount({root:el,contacts,companies,activities,personPipeline,getSession:async()=>{const {data}=await sb.auth.getSession();return data.session},refresh:load,importLeads:importResearchLeads})}
else if(tab==='Companies'){el.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Companies</h2>${btn('Add company','newCompany')}</div><input id="companySearch" placeholder="Search company / sector"><div id="companyList"></div></div>`;drawCompanies()}
else if(tab==='Pipeline'){drawPipeline()}
else if(tab==='Contacts'){el.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Contacts</h2>${btn('Add contact','newContact')}</div><input id="contactSearch" placeholder="Search names, email, company"><div id="contactList"></div></div>`;drawContacts()}
else if(tab==='Follow-ups'){el.innerHTML=`<div class="card"><h2>Follow-ups</h2>${companies.filter(c=>c.next_contact).sort((a,b)=>a.next_contact.localeCompare(b.next_contact)).map(c=>`<div class="item">${escape(c.next_contact)} · <b>${escape(c.name)}</b> · ${escape(c.stage)} ${btn('Edit','company:'+c.id)}</div>`).join('')||'No follow-ups yet.'}</div>`}
else if(tab==='Campaigns'){el.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Email campaigns</h2>${btn('Create campaign','newCampaign')}</div><p class="muted">Select multiple recipients, prepare individual emails in Outlook, then mark sent manually. No automatic sending or inbox sync.</p>${campaigns.map(c=>`<div class="item"><b>${escape(c.name)}</b> <span class="pill">${escape(c.template)}</span> · ${recipients.filter(r=>r.campaign_id===c.id).length} recipients ${btn('Manage','campaign:'+c.id)}</div>`).join('')||'No campaigns yet.'}</div>`}
else if(tab==='Team'&&memberRole==='admin'){el.innerHTML='<div class="card"><h2>Team management</h2><p class="muted">Invite a colleague using Supabase Authentication → Users → Send invitation, then paste their User UID and email below to approve them. Only administrators can approve or change access.</p><form id="memberForm"><label>Invited user UID</label><input name="uid" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><label>Work email</label><input name="email" type="email" required><label>Role</label><select name="role"><option value="staff">Staff</option><option value="admin">Administrator</option></select><p><button class="primary">Approve team member</button></p></form><div id="teamList">Loading team...</div></div>';loadTeam()}
else if(tab==='Find Customers'){el.innerHTML=`<div class="card"><h2>Find customers & business email addresses</h2><p class="muted">Prepare a targeted research request for ChatGPT, then import the reviewed CSV results into the shared Sales Hub. Research is not run automatically within this website.</p><div class="grid"><div><label>Customer type</label><input id="leadSector" placeholder="e.g. Roofing contractors" value="Roofing contractors"></div><div><label>Area</label><input id="leadArea" placeholder="e.g. West Midlands" value="West Midlands"></div><div><label>Number of companies</label><input id="leadCount" type="number" min="1" max="100" value="30"></div></div><label>Specific requirements (optional)</label><textarea id="leadDetails" placeholder="e.g. Social housing roofing, planned maintenance, commercial contracts"></textarea><div class="row">${btn('Copy research request','copyLeadRequest')}<a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT</a></div><p class="muted">Ask ChatGPT to return a CSV with the exact columns below. Check sources and email addresses before outreach. Do not assume guessed email formats are verified.</p><h3>Import researched contacts</h3><p class="muted">Required CSV headers: company,name,role,email,phone,verified. Only rows with a company name and valid-looking email address are imported. Existing email addresses are skipped.</p><input type="file" id="csv" accept=".csv,text/csv"><div class="row" style="margin-top:12px">${btn('Import researched CSV','importCsv')}</div><p class="muted">Use only relevant professional contact information and honour opt-outs and UK marketing rules.</p></div>`}
else if(tab==='Import / Export'){el.innerHTML=`<div class="card"><h2>Migrate your old Sales Hub</h2><p class="muted">Upload the JSON backup exported from the previous offline hub. Imports companies, contacts, activities and campaigns. Existing email addresses and company names are skipped. Export the current live data before importing.</p><input type="file" id="legacy" accept=".json"><div class="row" style="margin-top:12px">${btn('Import legacy JSON','importLegacy')}${btn('Download live backup','export')}</div><h2>Import contacts CSV</h2><p class="muted">Columns: company, name (or person), role, email, phone, verified. Duplicate emails are skipped.</p><input type="file" id="csv" accept=".csv,text/csv">${btn('Import contacts CSV','importCsv')}</div>`}}
async function loadTeam(){if(memberRole!=='admin')return;const {data,error}=await sb.from('team_members').select('user_id,email,role,active,created_at').order('created_at',{ascending:true});const target=$('teamList');if(!target)return;if(error){target.textContent=error.message;return}target.innerHTML='<h3>Approved and suspended accounts</h3>'+data.map(m=>'<div class="item"><b>'+escape(m.email)+'</b> · '+escape(m.role)+' · '+(m.active?'Active':'Suspended')+(m.user_id===session.user.id?' · Your account': ' <button data-act="toggleMember:'+m.user_id+':'+(m.active?'off':'on')+'">'+(m.active?'Suspend':'Reactivate')+'</button> <button data-act="roleMember:'+m.user_id+':'+(m.role==='admin'?'staff':'admin')+'">Make '+(m.role==='admin'?'staff':'admin')+'</button>')+'</div>').join('');const form=$('memberForm');if(form)form.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(form));if(!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(v.uid))return alert('Enter a valid Supabase user UID');if(v.role==='admin'&&!confirm('Grant administrator permissions to '+v.email+'?'))return;const {error}=await sb.from('team_members').insert({user_id:v.uid,email:v.email.trim().toLowerCase(),role:v.role,active:true});if(error)return alert(error.message+' — confirm the invitation exists in Supabase Authentication first.');notice('Staff account approved');await loadTeam()}}
function personPipeline(p){const rows=activities.filter(a=>a.contact_id===p.id&&a.action==='contact_pipeline').sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));return rows.length?emailPlanDetails(rows[0]):{stage:companyById(p.company_id)?.stage||stages[0]}}
async function savePersonPipeline(p,patch){const old=personPipeline(p);const {error}=await sb.from('activities').insert({company_id:p.company_id,contact_id:p.id,action:'contact_pipeline',details:JSON.stringify({...old,...patch})});if(error)throw error}
async function personEmailSent(p){const state=personPipeline(p);await savePersonPipeline(p,{stage:state.stage==='Not contacted'?'Contacted':state.stage,last_contact:date()})}
function drawPipeline(){const el=$('content');el.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Live contact pipeline</h2>${btn('Add person','newContact')}${btn('Refresh pipeline','refreshPipeline')}</div><p class="muted">Each person has their own pipeline stage. Company names appear beneath each person. Changes are shared with the RSUK team.</p><div class="grid"><div><div class="muted">People</div><div class="stat">${contacts.length}</div></div><div><div class="muted">Active contacts</div><div class="stat">${contacts.filter(p=>!['First order won','Not suitable'].includes(personPipeline(p).stage)).length}</div></div></div></div>${plannedEmailsHTML()}<div class="pipeline-board">${plannedFollowUpColumn()}${stages.map(stage=>{const items=contacts.filter(p=>personPipeline(p).stage===stage);return `<section class="pipeline-column"><h3>${escape(stage)} <span class="pill">${items.length}</span></h3>${items.map(p=>`<div class="pipeline-card"><b>${escape(p.name||p.email)}</b><p>${escape(companyById(p.company_id)?.name||'Company unavailable')}</p><p class="muted">${escape(p.role||'')}<br>${escape(p.email||'')}${p.opted_out?' · OPTED OUT':''}</p>${contactFollowUpHTML(p)}<label>Move to stage</label><select class="pipeline-stage" data-person="${escape(p.id)}">${option(stages,personPipeline(p).stage)}</select><div class="row" style="margin-top:8px">${btn('Edit person','contact:'+p.id)}${p.opted_out?'':btn('Email contact','emailContact:'+p.id)+btn('Plan follow-up','planContactFollowUp:'+p.id)}</div></div>`).join('')||'<p class="muted">No people</p>'}</section>`}).join('')}</div>`}

function emailPlanDetails(a){try{return JSON.parse(a.details)||{}}catch{return {}}}
function plannedEmailsHTML(){const plans=activities.filter(a=>a.action==='planned_email').sort((a,b)=>(emailPlanDetails(a).due||'').localeCompare(emailPlanDetails(b).due||''));return `<div class="card"><div class="row"><h2 style="flex:1">Planned follow-up emails <span class="pill">${plans.length}</span></h2>${btn('Plan follow-up email','planEmail')}</div><p class="muted">Shared email plans, ordered by date. Open an Outlook draft and send manually, then mark it sent.</p>${plans.map(a=>{const d=emailPlanDetails(a),p=contacts.find(p=>p.id===a.contact_id),co=companyById(a.company_id);return `<div class="item"><div class="row"><b>${escape(co?.name||'Company unavailable')}</b><span class="pill">${escape(d.due)}${d.due<date()?' · OVERDUE':d.due===date()?' · TODAY':''}</span></div><p>${escape(p?.name||'Contact unavailable')} · ${escape(p?.email||'')}${p?.opted_out?' · OPTED OUT':''}</p>${d.notes?`<p class="muted">${escape(d.notes)}</p>`:''}<div class="row">${btn('Edit plan','planEmail:'+a.id)}${p&&!p.opted_out?btn('Open Outlook draft','plannedDraft:'+a.id)+btn('Mark sent','plannedSent:'+a.id):''}${btn('Cancel plan','cancelPlan:'+a.id)}</div></div>`}).join('')||'<p class="muted">No follow-up emails planned yet.</p>'}</div>`}

function plannedFollowUpColumn(){const plans=activities.filter(a=>a.action==='planned_email').sort((a,b)=>(emailPlanDetails(a).due||'').localeCompare(emailPlanDetails(b).due||''));return `<section class="pipeline-column"><h3>Planned follow-up <span class="pill">${plans.length}</span></h3><p class="muted">People with a planned email</p>${plans.map(a=>{const p=contacts.find(p=>p.id===a.contact_id),d=emailPlanDetails(a);return `<div class="pipeline-card"><b>${escape(p?.name||'Contact unavailable')}</b><p>${escape(companyById(a.company_id)?.name||'Company unavailable')}</p><p class="muted" style="overflow-wrap:anywhere">${escape(p?.email||'')}${p?.opted_out?' · OPTED OUT':''}</p><p class="muted">${escape(d.due)}${d.due<date()?' · OVERDUE':''}</p>${btn('Edit plan','planEmail:'+a.id)}${p&&!p.opted_out?btn('Open draft','plannedDraft:'+a.id)+btn('Mark sent','plannedSent:'+a.id):''}</div>`}).join('')||'<p class="muted">No planned follow-ups</p>'}</section>`}
function contactFollowUpHTML(p){const plans=activities.filter(a=>a.action==='planned_email'&&a.contact_id===p.id).sort((a,b)=>(emailPlanDetails(a).due||'').localeCompare(emailPlanDetails(b).due||''));if(!plans.length)return '';const a=plans[0],d=emailPlanDetails(a);return `<p class="muted">Next follow-up: ${escape(d.due)}${d.due<date()?' · OVERDUE':d.due===date()?' · TODAY':''}</p>${btn('Edit follow-up','planEmail:'+a.id)}`}
function editEmailPlan(id,selectedContactId){const a=activities.find(a=>a.id===id&&a.action==='planned_email'),d=a?emailPlanDetails(a):{},eligible=contacts.filter(p=>!p.opted_out);if(!eligible.length)throw Error('Add an eligible contact before planning an email.');modal(`<h2>${a?'Edit':'Plan'} follow-up email</h2><form id="planEmailForm">${a?`<label for="planContact">Contact</label><select id="planContact" name="contact_id" required>${eligible.map(p=>`<option value="${escape(p.id)}" ${a.contact_id===p.id?'selected':''}>${escape(companyById(p.company_id)?.name)} — ${escape(p.name)} — ${escape(p.email)}</option>`).join('')}</select>`:`<label>Choose people</label><input id="planContactSearch" type="search" placeholder="Search people, companies or email" aria-label="Search people"><div class="row" style="margin-top:8px"><button type="button" data-act="selectPlanPeople">Select visible</button><button type="button" data-act="clearPlanPeople">Clear selection</button><span id="planSelectionCount" class="muted">0 selected</span></div><div style="max-height:240px;overflow:auto;margin-top:8px">${eligible.map(p=>`<label class="plan-person" style="padding:6px 0"><input type="checkbox" name="contact_ids" style="width:auto" value="${escape(p.id)}" ${p.id===selectedContactId?'checked':''}> ${escape(companyById(p.company_id)?.name)} — ${escape(p.name)} — ${escape(p.email)}</label>`).join('')}</div>`}<label for="planDue">Planned date</label><input id="planDue" name="due" type="date" required value="${escape(d.due||date())}"><label for="planTemplate">Email template</label><select id="planTemplate" name="template">${option(Object.keys(templates),d.template||'follow')}</select><label for="planNotes">Notes</label><textarea id="planNotes" name="notes" placeholder="What should this follow-up cover?">${escape(d.notes||'')}</textarea><p class="muted">A separate plan is saved for each selected person with this date, template and notes. Emails are sent manually in Outlook.</p><button class="primary" type="submit">Save email plan${a?'':'s'}</button></form>`);const form=$('planEmailForm');if(!a){const count=()=>{$('planSelectionCount').textContent=form.querySelectorAll('[name="contact_ids"]:checked').length+' selected'};form.onchange=count;count();$('planContactSearch').oninput=e=>{const q=e.target.value.toLowerCase();form.querySelectorAll('.plan-person').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))}}form.onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('[type="submit"]');button.disabled=true;try{const data=new FormData(e.target),v=Object.fromEntries(data),ids=a?[v.contact_id]:[...new Set(data.getAll('contact_ids'))];if(!ids.length)throw Error('Select at least one person.');const people=ids.map(id=>contacts.find(p=>p.id===id&&!p.opted_out));if(people.some(p=>!p))throw Error('Contact unavailable or opted out');const rows=people.map(p=>({company_id:p.company_id,contact_id:p.id,actor_id:session.user.id,action:'planned_email',details:JSON.stringify({due:v.due,template:v.template,notes:v.notes})}));if(a){await mutate('activities',rows[0],a.id)}else{const {error}=await sb.from('activities').insert(rows);if(error)throw error;await load();$('modal').close();notice(rows.length+' follow-up email plans saved')}}catch(err){alert(err.message);button.disabled=false}}}

async function importLegacy(){const f=$('legacy')?.files[0];if(!f)return alert('Choose a JSON file');try{const x=JSON.parse(await f.text());if(!Array.isArray(x.companies)||!Array.isArray(x.contacts))throw Error('Invalid backup');if(!confirm(`Import up to ${x.companies.length} companies and ${x.contacts.length} contacts? Existing records will be retained.`))return;let map=new Map();for(const c of x.companies){let existing=companies.find(y=>y.name.toLowerCase()===String(c.name).toLowerCase());if(!existing){const {data,error}=await sb.from('companies').insert({name:c.name,sector:c.sector||sectors[0],stage:c.stage||stages[0],region:c.region||'',value:Number(c.value)||0,next_contact:c.next||null,last_contact:c.last||null,notes:c.notes||'',source:c.source||'Legacy import'}).select('id').single();if(error)throw error;existing={id:data.id,name:c.name};companies.push(existing)}map.set(c.name.toLowerCase(),existing.id)}let count=0;for(const p of x.contacts){if(!p.email||contacts.some(z=>z.email.toLowerCase()===p.email.toLowerCase()))continue;let cid=map.get(String(p.company||'').toLowerCase());if(!cid)continue;const {error}=await sb.from('contacts').insert({company_id:cid,name:p.name||'',role:p.role||'',email:p.email,phone:p.phone||'',verification:p.verified||''});if(error)throw error;contacts.push({email:p.email});count++}let campaignsAdded=0;for(const ca of (x.campaigns||[])){const {data,error}=await sb.from('campaigns').insert({name:ca.name||'Imported campaign',template:templates[ca.template]?ca.template:'intro',created_by:session.user.id}).select('id').single();if(error)throw error;campaignsAdded++;for(const entry of (ca.contacts||[])){let oldId=typeof entry==='object'?entry.contactId||entry.id:entry;let old=x.contacts.find(p=>String(p.id)===String(oldId));let now=contacts.find(p=>p.email?.toLowerCase()===old?.email?.toLowerCase());if(now?.id)await sb.from('campaign_recipients').upsert({campaign_id:data.id,contact_id:now.id,status:'pending'},{onConflict:'campaign_id,contact_id'})}}await load();notice(`Imported ${count} new contacts and ${campaignsAdded} campaigns. Check records and campaign membership.`)}catch(e){notice(e.message,true)}}
function leadRequest(){let sector=($('leadSector')?.value||'businesses').trim(),area=($('leadArea')?.value||'West Midlands').trim(),count=Math.max(1,Math.min(100,Number($('leadCount')?.value)||30)),details=($('leadDetails')?.value||'').trim();return 'Research '+count+' genuine '+sector+' in '+area+' that could purchase scaffolding services from RSUK Scaffolding. '+(details?'Additional criteria: '+details+'. ':'')+'Find publicly listed business contact emails and named business contacts only where sourced. Do not invent companies, names or guess email formats. Verify against company websites or reliable public sources; clearly mark unverified details. Return a downloadable UTF-8 CSV with EXACT headers: company,name,role,email,phone,verified. One contact per row; exclude rows without a real email address. Also give source links in your response so I can review them. Do not send emails.'}
async function importResearchLeads(leads,settings,reportId){const allowed=[];for(const lead of leads||[]){const email=String(lead.email||'').trim();if(!/^\S+@\S+\.\S+$/.test(email))continue;let contact=contacts.find(p=>p.email?.toLowerCase()===email.toLowerCase());if(contact){if(!contact.opted_out&&personPipeline(contact).stage!=='Not suitable')allowed.push(contact);continue}let company=companies.find(c=>c.name.toLowerCase()===String(lead.company||'').toLowerCase());if(!company){const notes=[lead.buyingSignal?'Buying signal: '+lead.buyingSignal:'',lead.signalSource?'Signal source: '+lead.signalSource:'',lead.website?'Website: '+lead.website:'',reportId?'Sales Hub research report: '+reportId:''].filter(Boolean).join('\n');const {data,error}=await sb.from('companies').insert({name:lead.company,sector:settings?.sector||'Tier 1 construction',stage:'Not contacted',region:lead.area||settings?.area||'',source:'Sales Hub sourced research',notes}).select('*').single();if(error)throw error;company=data;companies.push(company)}const source=lead.contactSource||lead.signalSource||'Sales Hub research';const verification='Published business email; delivery not tested. Source: '+source+(lead.hunterStatus?' | Hunter: '+lead.hunterStatus:'');const {data,error}=await sb.from('contacts').insert({company_id:company.id,name:lead.contactName||'',role:lead.contactRole||'',email,phone:lead.phone||'',verification,opted_out:false}).select('*').single();if(error)throw error;contacts.push(data);allowed.push(data)}await load();return allowed.map(p=>contacts.find(x=>x.id===p.id)||p)}
function parseCSV(s){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(Boolean))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(Boolean))rows.push(row);return rows}
async function importCsv(){const f=$('csv')?.files[0];if(!f)return alert('Choose a CSV file');try{let rows=parseCSV((await f.text()).replace(/^\ufeff/,'')),headers=rows.shift().map(x=>x.toLowerCase().trim().replaceAll(' ','_')),added=0;for(let row of rows){let x={};headers.forEach((h,i)=>x[h]=row[i]||'');let company=x.company||(x.person?x.name:'');let person=x.person||(x.company?x.name:'');if(!company||!/^\S+@\S+\.\S+$/.test(x.email||''))continue;if(contacts.some(p=>p.email.toLowerCase()===x.email.toLowerCase()))continue;let c=companies.find(y=>y.name.toLowerCase()===company.toLowerCase());if(!c){const {data,error}=await sb.from('companies').insert({name:company,source:'CSV import'}).select('*').single();if(error)throw error;c=data;companies.push(c)}const {data,error}=await sb.from('contacts').insert({company_id:c.id,name:person||'',role:x.role||'',email:x.email,phone:x.phone||'',verification:x.verified||x.notes||'CSV import; verify'}).select('*').single();if(error)throw error;contacts.push(data);added++}await load();notice(`${added} contacts imported`)}catch(e){notice(e.message,true)}}

$('nav').onclick=e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render()}};$('content').addEventListener('input',e=>{if(e.target.id==='companySearch')drawCompanies();if(e.target.id==='contactSearch')drawContacts()});$('content').addEventListener('change',async e=>{if(!e.target.matches('.pipeline-stage,.contact-stage'))return;const select=e.target,p=contacts.find(p=>p.id===select.dataset.person);if(!p)return;const stage=select.value,previous=personPipeline(p).stage;select.disabled=true;try{await savePersonPipeline(p,{stage});await load();notice('Contact moved to '+stage)}catch(err){select.value=previous;notice(err.message,true)}finally{select.disabled=false}});document.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;const [act,a,c]=b.dataset.act.split(':');try{if(act==='selectPlanPeople'||act==='clearPlanPeople'){const form=$('planEmailForm');form.querySelectorAll('.plan-person').forEach(row=>{if(act==='clearPlanPeople'||!row.hidden)row.querySelector('input').checked=act==='selectPlanPeople'});form.onchange();return}if(act==='planContactFollowUp'){const p=contacts.find(p=>p.id===a&&!p.opted_out);if(!p)throw Error('Contact unavailable or opted out');editEmailPlan(undefined,p.id);return}if(act==='planEmail'){editEmailPlan(a);return}if(['plannedDraft','plannedSent','cancelPlan'].includes(act)){const plan=activities.find(x=>x.id===a&&x.action==='planned_email');if(!plan)throw Error('Email plan unavailable; refresh the pipeline.');const p=contacts.find(x=>x.id===plan.contact_id),d=emailPlanDetails(plan);if(act!=='cancelPlan'&&(!p||p.opted_out))throw Error('Contact unavailable or opted out');if(act==='plannedDraft'){window.open(mail(p,d.template||'follow'),'_blank','noopener');return}if(!confirm(act==='plannedSent'?'Confirm you have sent this follow-up email in Outlook?':'Cancel this planned follow-up email?'))return;b.disabled=true;try{if(act==='plannedSent'){await personEmailSent(p)}const {error}=await sb.from('act
