<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSUK Sales Hub</title><style>
:root{font-family:Inter,system-ui,Arial;color:#eaf0f9;background:#0b1424}*{box-sizing:border-box}body{margin:0}header{background:#111e33;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:22px;margin:0}h2{font-size:19px}main{max-width:1180px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}button{cursor:pointer;border:1px solid #35445a;border-radius:8px;padding:10px 13px;background:#20334d;color:white}button.primary{background:#2563eb;border-color:#2563eb}button:hover{filter:brightness(1.15)}input,select,textarea{background:#101e31;color:white;border:1px solid #46566c;border-radius:7px;padding:10px;width:100%;font:inherit}textarea{min-height:90px}label{display:block;font-size:12px;color:#b4c6dd;margin:10px 0 5px}.card{background:#14243a;border:1px solid #314258;border-radius:12px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:29px;font-weight:800}.muted{color:#a7b9cd;font-size:13px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.item{border-top:1px solid #34455a;padding:12px 0}.item:first-child{border:0}.pill{font-size:12px;border-radius:20px;padding:4px 9px;background:#2d425e}.hidden{display:none!important}.error{color:#ffb0b0}.success{color:#9be3bb}dialog{background:#14243a;color:white;border:1px solid #40536a;border-radius:12px;width:min(600px,95vw)}dialog::backdrop{background:#0009}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #30425b}a{color:#9ec4ff}#status{font-size:13px;margin:10px 0}
 .pipeline-board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding:8px 0 20px}.pipeline-column{flex:0 0 255px;max-height:70vh;overflow-y:auto;background:#101e31;border:1px solid #314258;border-radius:10px;padding:12px}.pipeline-column h3{font-size:15px;margin:4px 0 12px}.pipeline-card{background:#1a2b43;border:1px solid #40516a;border-radius:9px;padding:12px;margin:10px 0}.pipeline-card p{margin:8px 0}.pipeline-stage{font-size:12px;padding:8px} </style></head><body><header><div><h1>RSUK / Sales Hub</h1><div class="muted">Shared sales CRM · Coventry & Birmingham</div></div><button id="logout" class="hidden">Sign out</button></header><main><section id="login" class="card"><h2>Team sign in</h2><p class="muted">Only invited, approved RSUK team members can access records.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div class="row" style="margin-top:12px"><button class="primary" id="signin">Sign in</button><button id="reset">Send password reset</button></div><p id="loginmsg" class="muted"></p></section><section id="app" class="hidden"><nav id="nav"></nav><div id="status"></div><div id="content"></div></section></main><dialog id="modal"><div id="modalcontent"></div><div class="row" style="margin-top:14px"><button onclick="document.getElementById('modal').close()">Close</button></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script>
(()=>{'use strict';const cfg=window.RSUK_CONFIG||{};const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sectors=['Tier 1 construction','Social housing / planned maintenance','Industrial / power stations','Pharmaceutical / manufacturing','Roofing / solar','Facilities management'];const stages=['Not contacted','Contacted','Interested','Meeting booked','Approved supplier','Quote submitted','First order won','Not suitable'];let sb,session,memberRole='staff',tab='Dashboard',companies=[],contacts=[],activities=[],campaigns=[],recipients=[];const fmt=n=>'£'+Number(n||0).toLocaleString('en-GB');const date=()=>new Date().toISOString().slice(0,10);const notice=(m,bad=false)=>{$('status').textContent=m;$('status').className=bad?'error':'success'};const option=(arr,val)=>arr.map(s=>`<option value="${escape(s)}" ${s===val?'selected':''}>${escape(s)}</option>`).join('');const companyById=id=>companies.find(c=>c.id===id);const coOptions=()=>companies.map(c=>`<option value="${c.id}">${escape(c.name)}</option>`).join('');const btn=(text,act)=>`<button data-act="${act}">${escape(text)}</button>`;
if(!cfg.url||!cfg.anonKey||!window.supabase){$('loginmsg').textContent='Deployment configuration missing. Follow README.md to configure Supabase.';return}sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
async function load(){const names=['companies','contacts','activities','campaigns','campaign_recipients'];const res=await Promise.all(names.map(n=>sb.from(n).select('*').limit(5000)));const bad=res.find(x=>x.error);if(bad)throw bad.error;[companies,contacts,activities,campaigns,recipients]=res.map(x=>x.data||[]);render()}
async function auth(){let {data:{session:s}}=await sb.auth.getSession();session=s;if(!s){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return}const {data:member,error}=await sb.from('team_members').select('role,active').eq('user_id',s.user.id).maybeSingle();if(error||!member?.active){await sb.auth.signOut();$('loginmsg').textContent='Your account is not yet approved by the RSUK administrator.';return auth()}memberRole=member.role;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');try{await load()}catch(e){notice(e.message,true)}}
$('signin').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginmsg').textContent=error?.message||'';if(!error)await auth()};$('reset').onclick=async()=>{const {error}=await sb.auth.resetPasswordForEmail($('email').value,{redirectTo:location.origin});$('loginmsg').textContent=error?.message||'If the account exists, a reset email has been sent.'};$('logout').onclick=async()=>{await sb.auth.signOut();await auth()};sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')auth()});
function render(){const tabs=['Dashboard','Companies','Contacts','Pipeline','Follow-ups','Campaigns','Find Customers','Import / Export'];if(memberRole==='admin')tabs.push('Team');$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'primary':''}" data-tab="${t}">${t}</button>`).join('');const el=$('content');if(tab==='Dashboard'){let due=companies.filter(c=>c.next_contact&&c.next_contact<=date()&&!['First order won','Not suitable'].includes(c.stage));el.innerHTML=`<div class="grid">${[['Companies',companies.length],['Contacts',contacts.length],['Follow-ups due',due.length],['First orders',companies.filter(c=>c.stage==='First order won').length],['Opportunity value',fmt(companies.reduce((s,c)=>s+Number(c.value||0),0))]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="stat">${b}</div></div>`).join('')}</div><div class="card"><h2>Follow-ups due</h2>${due.map(c=>`<div class="item">${escape(c.name)} · ${escape(c.next_contact)} ${btn('Open','company:'+c.id)}</div>`).join('')||'<p class="muted">Nothing due.</p>'}</div>`}
else if(tab==='Companies'){el.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Companies</h2>${btn('Add company','newCompany')}</div><input id="companySearch" placeholder="Search company / sector"><div id="companyList"></div></div>`;drawCompanies()}
else if(tab==='Pipeline'){drawPipeline()}
else if(tab==='Contacts'){el.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Contacts</h2>${btn('Add contact','newContact')}</div><input id="contactSearch" placeholder="Search names, email, company"><div id="contactList"></div></div>`;drawContacts()}
else if(tab==='Follow-ups'){el.innerHTML=`<div class="card"><h2>Follow-ups</h2>${companies.filter(c=>c.next_contact).sort((a,b)=>a.next_contact.localeCompare(b.next_contact)).map(c=>`<div class="item">${escape(c.next_contact)} · <b>${escape(c.name)}</b> · ${escape(c.stage)} ${btn('Edit','company:'+c.id)}</div>`).join('')||'No follow-ups yet.'}</div>`}
else if(tab==='Campaigns'){el.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Email campaigns</h2>${btn('Create campaign','newCampaign')}</div><p class="muted">Select multiple recipients, prepare individual emails in Outlook, then mark sent manually. No automatic sending or inbox sync.</p>${campaigns.map(c=>`<div class="item"><b>${escape(c.name)}</b> <span class="pill">${escape(c.template)}</span> · ${recipients.filter(r=>r.campaign_id===c.id).length} recipients ${btn('Manage','campaign:'+c.id)}</div>`).join('')||'No campaigns yet.'}</div>`}
else if(tab==='Team'&&memberRole==='admin'){el.innerHTML='<div class="card"><h2>Team management</h2><p class="muted">Invite a colleague using Supabase Authentication → Users → Send invitation, then paste their User UID and email below to approve them. Only administrators can approve or change access.</p><form id="memberForm"><label>Invited user UID</label><input name="uid" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><label>Work email</label><input name="email" type="email" required><label>Role</label><select name="role"><option value="staff">Staff</option><option value="admin">Administrator</option></select><p><button class="primary">Approve team member</button></p></form><div id="teamList">Loading team...</div></div>';loadTeam()}
else if(tab==='Find Customers'){el.innerHTML=`<div class="card"><h2>Find customers & business email addresses</h2><p class="muted">Prepare a targeted research request for ChatGPT, then import the reviewed CSV results into the shared Sales Hub. Research is not run automatically within this website.</p><div class="grid"><div><label>Customer type</label><input id="leadSector" placeholder="e.g. Roofing contractors" value="Roofing contractors"></div><div><label>Area</label><input id="leadArea" placeholder="e.g. West Midlands" value="West Midlands"></div><div><label>Number of companies</label><input id="leadCount" type="number" min="1" max="100" value="30"></div></div><label>Specific requirements (optional)</label><textarea id="leadDetails" placeholder="e.g. Social housing roofing, planned maintenance, commercial contracts"></textarea><div class="row">${btn('Copy research request','copyLeadRequest')}<a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT</a></div><p class="muted">Ask ChatGPT to return a CSV with the exact columns below. Check sources and email addresses before outreach. Do not assume guessed email formats are verified.</p><h3>Import researched contacts</h3><p class="muted">Required CSV headers: company,name,role,email,phone,verified. Only rows with a company name and valid-looking email address are imported. Existing email addresses are skipped.</p><input type="file" id="csv" accept=".csv,text/csv"><div class="row" style="margin-top:12px">${btn('Import researched CSV','importCsv')}</div><p class="muted">Use only relevant professional contact information and honour opt-outs and UK marketing rules.</p></div>`}
else if(tab==='Import / Export'){el.innerHTML=`<div class="card"><h2>Migrate your old Sales Hub</h2><p class="muted">Upload the JSON backup exported from the previous offline hub. Imports companies, contacts, activities and campaigns. Existing email addresses and company names are skipped. Export the current live data before importing.</p><input type="file" id="legacy" accept=".json"><div class="row" style="margin-top:12px">${btn('Import legacy JSON','importLegacy')}${btn('Download live backup','export')}</div><h2>Import contacts CSV</h2><p class="muted">Columns: company, name (or person), role, email, phone, verified. Duplicate emails are skipped.</p><input type="file" id="csv" accept=".csv,text/csv">${btn('Import contacts CSV','importCsv')}</div>`}}
async function loadTeam(){if(memberRole!=='admin')return;const {data,error}=await sb.from('team_members').select('user_id,email,role,active,created_at').order('created_at',{ascending:true});const target=$('teamList');if(!target)return;if(error){target.textContent=error.message;return}target.innerHTML='<h3>Approved and suspended accounts</h3>'+data.map(m=>'<div class="item"><b>'+escape(m.email)+'</b> · '+escape(m.role)+' · '+(m.active?'Active':'Suspended')+(m.user_id===session.user.id?' · Your account': ' <button data-act="toggleMember:'+m.user_id+':'+(m.active?'off':'on')+'">'+(m.active?'Suspend':'Reactivate')+'</button> <button data-act="roleMember:'+m.user_id+':'+(m.role==='admin'?'staff':'admin')+'">Make '+(m.role==='admin'?'staff':'admin')+'</button>')+'</div>').join('');const form=$('memberForm');if(form)form.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(form));if(!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(v.uid))return alert('Enter a valid Supabase user UID');if(v.role==='admin'&&!confirm('Grant administrator permissions to '+v.email+'?'))return;const {error}=await sb.from('team_members').insert({user_id:v.uid,email:v.email.trim().toLowerCase(),role:v.role,active:true});if(error)return alert(error.message+' — confirm the invitation exists in Supabase Authentication first.');notice('Staff account approved');await loadTeam()}}
function drawPipeline(){const el=$('content'),now=date(),total=companies.reduce((sum,c)=>sum+Number(c.value||0),0);el.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Live customer pipeline</h2>${btn('Add opportunity','newCompany')}${btn('Refresh pipeline','refreshPipeline')}</div><p class="muted">Shared customer opportunities · updates are saved for the whole RSUK team.</p><div class="grid"><div><div class="muted">Opportunities</div><div class="stat">${companies.filter(c=>!['Not suitable','First order won'].includes(c.stage)).length}</div></div><div><div class="muted">Pipeline value</div><div class="stat">${fmt(total)}</div></div><div><div class="muted">Overdue follow-ups</div><div class="stat">${companies.filter(c=>c.next_contact&&c.next_contact<now&&!['Not suitable','First order won'].includes(c.stage)).length}</div></div></div></div><div class="pipeline-board">${stages.map(stage=>{const items=companies.filter(c=>c.stage===stage);return `<section class="pipeline-column"><h3>${escape(stage)} <span class="pill">${items.length}</span></h3><p class="muted">${fmt(items.reduce((sum,c)=>sum+Number(c.value||0),0))}</p>${items.map(c=>`<div class="pipeline-card"><b>${escape(c.name)}</b><p class="muted">${escape(c.sector||'')} · ${fmt(c.value)}</p><p class="muted">${c.next_contact?'Follow-up: '+escape(c.next_contact)+(c.next_contact<now?' · OVERDUE':''):'No follow-up scheduled'}</p><label>Move to stage</label><select class="pipeline-stage" data-id="${escape(c.id)}">${option(stages,c.stage)}</select><div style="margin-top:8px">${btn('Edit details','company:'+c.id)} ${contacts.some(p=>p.company_id===c.id&&!p.opted_out)?btn('Email contact','pipelineEmail:'+c.id):''}</div></div>`).join('')||'<p class="muted">No customers</p>'}</section>`}).join('')}</div>`}
function drawCompanies(){let q=($('companySearch')?.value||'').toLowerCase();$('companyList').innerHTML=companies.filter(c=>(c.name+' '+c.sector).toLowerCase().includes(q)).map(c=>`<div class="item"><b>${escape(c.name)}</b> · <span class="pill">${escape(c.stage)}</span><div class="muted">${escape(c.sector)} · ${escape(c.region||'')} · ${fmt(c.value)} · ${contacts.filter(p=>p.company_id===c.id).length} contacts</div>${btn('Edit','company:'+c.id)} ${btn('Email contacts','emailCompany:'+c.id)}</div>`).join('')||'No matching companies'}
function drawContacts(){let q=($('contactSearch')?.value||'').toLowerCase();$('contactList').innerHTML=contacts.filter(p=>(p.name+' '+p.email+' '+(companyById(p.company_id)?.name||'')).toLowerCase().includes(q)).map(p=>`<div class="item"><b>${escape(p.name)}</b> · ${escape(p.role)}<div class="muted">${escape(companyById(p.company_id)?.name||'')} · ${escape(p.email)} ${p.opted_out?'· OPTED OUT':''}</div><div class="row" style="margin-top:9px">${btn('Edit','contact:'+p.id)} ${p.opted_out?'':btn('Email','emailContact:'+p.id)} <label style="margin:0">Pipeline <select class="contact-stage" data-company="${escape(p.company_id)}">${option(stages,companyById(p.company_id)?.stage||stages[0])}</select></label></div></div>`).join('')||'No matching contacts'}
function modal(html){$('modalcontent').innerHTML=html;$('modal').showModal()};async function mutate(table,values,id){const q=id?sb.from(table).update(values).eq('id',id):sb.from(table).insert(values);const {error}=await q;if(error)throw error;await load();$('modal').close();notice('Saved successfully')}
function editCompany(id){const c=companyById(id)||{};modal(`<h2>${id?'Edit':'New'} company</h2><form id="coForm"><label>Company</label><input name="name" required value="${escape(c.name)}"><label>Sector</label><select name="sector">${option(sectors,c.sector)}</select><label>Stage</label><select name="stage">${option(stages,c.stage||stages[0])}</select><label>Region</label><input name="region" value="${escape(c.region)}"><label>Opportunity value (£)</label><input name="value" type="number" min="0" value="${Number(c.value||0)}"><label>Next follow-up</label><input name="next_contact" type="date" value="${escape(c.next_contact)}"><label>Notes</label><textarea name="notes">${escape(c.notes)}</textarea><p><button class="primary">Save</button></p></form>`);$('coForm').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.value=Number(x.value||0);x.next_contact||=null;try{await mutate('companies',x,id)}catch(err){alert(err.message)}}}
function editContact(id){const p=contacts.find(x=>x.id===id)||{};modal(`<h2>${id?'Edit':'New'} contact</h2><form id="ctForm"><label>Company</label><select name="company_id">${companies.map(c=>`<option value="${c.id}" ${p.company_id===c.id?'selected':''}>${escape(c.name)}</option>`).join('')}</select><label>Name</label><input name="name" required value="${escape(p.name)}"><label>Role</label><input name="role" value="${escape(p.role)}"><label>Email</label><input type="email" required name="email" value="${escape(p.email)}"><label>Phone</label><input name="phone" value="${escape(p.phone)}"><label>Verification / source</label><input name="verification" value="${escape(p.verification)}"><label><input style="width:auto" type="checkbox" name="opted_out" ${p.opted_out?'checked':''}> Opted out — do not email</label><p><button class="primary">Save</button></p></form>`);$('ctForm').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.opted_out=e.target.opted_out.checked;try{await mutate('contacts',x,id)}catch(err){alert(err.message)}}}
const templates={intro:{subject:'Scaffolding support – RSUK Scaffolding',body:'Good morning {first},\n\nI wanted to introduce RSUK Scaffolding and see whether we could support {company} with upcoming scaffolding requirements. We cover the Midlands and surrounding areas from our Coventry and Birmingham depots, are NASC accredited and can assist with planned and reactive access solutions.\n\nWould you be the right person to discuss subcontractor onboarding with?\n\nKind regards,\nRSUK Scaffolding\n07768 290310'},follow:{subject:'Following up – RSUK Scaffolding',body:'Good morning {first},\n\nI wanted to follow up regarding potential scaffolding support for {company}. Please let me know if there are any current requirements or the right contact for onboarding.\n\nKind regards,\nRSUK Scaffolding'},onboard:{subject:'Supplier onboarding enquiry – RSUK Scaffolding',body:'Good morning {first},\n\nCould you please advise on the process for RSUK Scaffolding to register as an approved scaffolding subcontractor for {company}? We are NASC accredited and cover the Midlands and surrounding areas.\n\nKind regards,\nRSUK Scaffolding'}};
function mail(p,kind='intro'){const co=companyById(p.company_id);let t=templates[kind]||templates.intro;const fill=s=>s.replaceAll('{first}',p.name.split(' ')[0]||'there').replaceAll('{company}',co?.name||'your business');const subject=fill(t.subject),body=fill(t.body);return `https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(p.email)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`}
function emailCompany(id){const arr=contacts.filter(p=>p.company_id===id&&!p.opted_out);modal(`<h2>Email people at ${escape(companyById(id)?.name)}</h2><p class="muted">Choose several recipients. Each gets a separate draft, not a CC/BCC blast.</p><label>Template</label><select id="tmpl">${option(Object.keys(templates),'intro')}</select><div class="row">${btn('Select all','selectAll')}${btn('Clear','clearAll')}</div>${arr.map(p=>`<label><input type="checkbox" class="emailpick" style="width:auto" value="${p.id}"> ${escape(p.name)} — ${escape(p.email)}</label>`).join('')||'No eligible contacts'}<div class="row">${btn('Prepare selected drafts','prepareDrafts')}</div>`)}
function newCampaign(){modal(`<h2>Create campaign</h2><form id="campForm"><label>Name</label><input name="name" required><label>Template</label><select name="template">${option(Object.keys(templates),'intro')}</select><p><button class="primary">Create</button></p></form>`);$('campForm').onsubmit=async e=>{e.preventDefault();try{await mutate('campaigns',{...Object.fromEntries(new FormData(e.target)),created_by:session.user.id})}catch(err){alert(err.message)}}}
function campaign(id){const c=campaigns.find(x=>x.id===id),rs=recipients.filter(r=>r.campaign_id===id);modal(`<h2>${escape(c.name)}</h2><p class="muted">Select recipients and save. Open Outlook drafts one at a time.</p><div class="row">${btn('Select all','selectAll')}${btn('Clear','clearAll')}${btn('Add selected','addRecipients:'+id)}</div><div style="max-height:250px;overflow:auto">${contacts.filter(p=>!p.opted_out).map(p=>`<label><input type="checkbox" class="emailpick" style="width:auto" value="${p.id}" ${rs.some(r=>r.contact_id===p.id)?'checked':''}> ${escape(p.name)} · ${escape(companyById(p.company_id)?.name)} · ${escape(p.email)}</label>`).join('')}</div><h3>Campaign recipients (${rs.length})</h3>${rs.map(r=>{let p=contacts.find(x=>x.id===r.contact_id);return p?`<div class="item">${escape(p.name)} · ${escape(r.status)} ${btn('Open draft','draft:'+p.id+':'+c.template)} ${btn('Mark sent','sent:'+id+':'+p.id)} ${btn('Mark replied','replied:'+id+':'+p.id)}</div>`:''}).join('')}</div>`)}
function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
async function importLegacy(){const f=$('legacy')?.files[0];if(!f)return alert('Choose a JSON file');try{const x=JSON.parse(await f.text());if(!Array.isArray(x.companies)||!Array.isArray(x.contacts))throw Error('Invalid backup');if(!confirm(`Import up to ${x.companies.length} companies and ${x.contacts.length} contacts? Existing records will be retained.`))return;let map=new Map();for(const c of x.companies){let existing=companies.find(y=>y.name.toLowerCase()===String(c.name).toLowerCase());if(!existing){const {data,error}=await sb.from('companies').insert({name:c.name,sector:c.sector||sectors[0],stage:c.stage||stages[0],region:c.region||'',value:Number(c.value)||0,next_contact:c.next||null,last_contact:c.last||null,notes:c.notes||'',source:c.source||'Legacy import'}).select('id').single();if(error)throw error;existing={id:data.id,name:c.name};companies.push(existing)}map.set(c.name.toLowerCase(),existing.id)}let count=0;for(const p of x.contacts){if(!p.email||contacts.some(z=>z.email.toLowerCase()===p.email.toLowerCase()))continue;let cid=map.get(String(p.company||'').toLowerCase());if(!cid)continue;const {error}=await sb.from('contacts').insert({company_id:cid,name:p.name||'',role:p.role||'',email:p.email,phone:p.phone||'',verification:p.verified||''});if(error)throw error;contacts.push({email:p.email});count++}let campaignsAdded=0;for(const ca of (x.campaigns||[])){const {data,error}=await sb.from('campaigns').insert({name:ca.name||'Imported campaign',template:templates[ca.template]?ca.template:'intro',created_by:session.user.id}).select('id').single();if(error)throw error;campaignsAdded++;for(const entry of (ca.contacts||[])){let oldId=typeof entry==='object'?entry.contactId||entry.id:entry;let old=x.contacts.find(p=>String(p.id)===String(oldId));let now=contacts.find(p=>p.email?.toLowerCase()===old?.email?.toLowerCase());if(now?.id)await sb.from('campaign_recipients').upsert({campaign_id:data.id,contact_id:now.id,status:'pending'},{onConflict:'campaign_id,contact_id'})}}await load();notice(`Imported ${count} new contacts and ${campaignsAdded} campaigns. Check records and campaign membership.`)}catch(e){notice(e.message,true)}}
function leadRequest(){let sector=($('leadSector')?.value||'businesses').trim(),area=($('leadArea')?.value||'West Midlands').trim(),count=Math.max(1,Math.min(100,Number($('leadCount')?.value)||30)),details=($('leadDetails')?.value||'').trim();return 'Research '+count+' genuine '+sector+' in '+area+' that could purchase scaffolding services from RSUK Scaffolding. '+(details?'Additional criteria: '+details+'. ':'')+'Find publicly listed business contact emails and named business contacts only where sourced. Do not invent companies, names or guess email formats. Verify against company websites or reliable public sources; clearly mark unverified details. Return a downloadable UTF-8 CSV with EXACT headers: company,name,role,email,phone,verified. One contact per row; exclude rows without a real email address. Also give source links in your response so I can review them. Do not send emails.'}
function parseCSV(s){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(Boolean))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(Boolean))rows.push(row);return rows}
async function importCsv(){const f=$('csv')?.files[0];if(!f)return alert('Choose a CSV file');try{let rows=parseCSV((await f.text()).replace(/^\ufeff/,'')),headers=rows.shift().map(x=>x.toLowerCase().trim().replaceAll(' ','_')),added=0;for(let row of rows){let x={};headers.forEach((h,i)=>x[h]=row[i]||'');let company=x.company||(x.person?x.name:'');let person=x.person||(x.company?x.name:'');if(!company||!/^\S+@\S+\.\S+$/.test(x.email||''))continue;if(contacts.some(p=>p.email.toLowerCase()===x.email.toLowerCase()))continue;let c=companies.find(y=>y.name.toLowerCase()===company.toLowerCase());if(!c){const {data,error}=await sb.from('companies').insert({name:company,source:'CSV import'}).select('*').single();if(error)throw error;c=data;companies.push(c)}const {data,error}=await sb.from('contacts').insert({company_id:c.id,name:person||'',role:x.role||'',email:x.email,phone:x.phone||'',verification:x.verified||x.notes||'CSV import; verify'}).select('*').single();if(error)throw error;contacts.push(data);added++}await load();notice(`${added} contacts imported`)}catch(e){notice(e.message,true)}}
async function exportData(){download('RSUK_Live_Backup_'+date()+'.json',JSON.stringify({companies,contacts,activities,campaigns,campaign_recipients:recipients,exported_at:new Date().toISOString()},null,2),'application/json')}
$('nav').onclick=e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render()}};$('content').addEventListener('input',e=>{if(e.target.id==='companySearch')drawCompanies();if(e.target.id==='contactSearch')drawContacts()});$('content').addEventListener('change',async e=>{if(!e.target.matches('.pipeline-stage,.contact-stage'))return;const select=e.target,id=select.dataset.id||select.dataset.company,stage=select.value,previous=companies.find(c=>c.id===id)?.stage;select.disabled=true;const {error}=await sb.from('companies').update({stage}).eq('id',id);select.disabled=false;if(error){select.value=previous;notice(error.message,true);return}await load();notice('Customer moved to '+stage)});document.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;const [act,a,c]=b.dataset.act.split(':');try{if(act==='toggleMember'||act==='roleMember'){if(memberRole!=='admin')throw Error('Administrator access required');if(a===session.user.id)throw Error('You cannot change your own account here');if(!confirm((act==='toggleMember'?(c==='off'?'Suspend':'Reactivate'):'Change role to '+c)+' this staff account?'))return;const change=act==='toggleMember'?{active:c==='on'}:{role:c};const {error}=await sb.from('team_members').update(change).eq('user_id',a);if(error)throw error;notice('Team access updated');await loadTeam();return}if(act==='refreshPipeline'){await load();return}if(act==='newCompany')editCompany();if(act==='company')editCompany(a);if(act==='newContact')editContact();if(act==='emailContact'){const p=contacts.find(x=>x.id===a);if(!p||p.opted_out)throw Error('Contact unavailable or opted out');modal(`<h2>Email ${escape(p.name)}</h2><p class="muted">Opens a pre-filled Outlook draft. Please send the email yourself, then mark it sent to move the company to Contacted.</p><label>Email template</label><select id="contactEmailTemplate">${option(Object.keys(templates),'intro')}</select><div class="row">${btn('Open Outlook draft','openContactDraft:'+p.id)} ${btn('I sent this email','markContactSent:'+p.id)}</div>`)}if(act==='openContactDraft'){const p=contacts.find(x=>x.id===a);if(!p||p.opted_out)throw Error('Contact unavailable or opted out');window.open(mail(p,$('contactEmailTemplate')?.value||'intro'),'_blank','noopener')}if(act==='markContactSent'){const p=contacts.find(x=>x.id===a);if(!p||p.opted_out)throw Error('Contact unavailable or opted out');if(!confirm('Confirm you have sent this email? This will update the customer pipeline.'))return;const co=companyById(p.company_id);if(!co)throw Error('Company not found');const next=co.stage==='Not contacted'?'Contacted':co.stage;const {error}=await sb.from('companies').update({stage:next,last_contact:date()}).eq('id',co.id);if(error)throw error;await load();$('modal').close();notice('Email marked sent; company pipeline updated')} if(act==='newContact')editContact();if(act==='contact')editContact(a);if(act==='pipelineEmail'){const eligible=contacts.filter(p=>p.company_id===a&&!p.opted_out);if(!eligible.length)throw Error('No eligible contacts at this company');modal(`<h2>Email contact at ${escape(companyById(a)?.name)}</h2><p class="muted">Choose a contact and email template. Outlook opens a draft; after sending, return to mark the email as sent.</p><label>Contact</label><select id="pipelineEmailPerson">${eligible.map(p=>`<option value="${escape(p.id)}">${escape(p.name)} — ${escape(p.email)}</option>`).join('')}</select><label>Template</label><select id="contactEmailTemplate">${option(Object.keys(templates),'intro')}</select><div class="row">${btn('Open Outlook draft','openPipelineDraft')} ${btn('I sent this email','confirmPipelineSent')}</div>`)}if(act==='openPipelineDraft'||act==='confirmPipelineSent'){const p=contacts.find(x=>x.id===$('pipelineEmailPerson')?.value);if(!p||p.opted_out)throw Error('Contact unavailable or opted out');if(act==='openPipelineDraft'){window.open(mail(p,$('contactEmailTemplate')?.value||'intro'),'_blank','noopener')}else{if(!confirm('Confirm you sent the email to '+p.name+'?'))return;const co=companyById(p.company_id);if(!co)throw Error('Company not found');const {error}=await sb.from('companies').update({stage:co.stage==='Not contacted'?'Contacted':co.stage,last_contact:date()}).eq('id',co.id);if(error)throw error;await load();$('modal').close();notice('Email marked sent; pipeline updated')}}if(act==='emailCompany')emailCompany(a);if(act==='newCampaign')newCampaign();if(act==='campaign')campaign(a);if(act==='importLegacy')await importLegacy();if(act==='importCsv')await importCsv();if(act==='copyLeadRequest'){const prompt=leadRequest();await navigator.clipboard.writeText(prompt);notice('Research request copied. Paste it into ChatGPT.')}if(act==='export')await exportData();if(act==='selectAll'||act==='clearAll')document.querySelectorAll('.emailpick').forEach(x=>x.checked=act==='selectAll');if(act==='prepareDrafts'){let ids=[...document.querySelectorAll('.emailpick:checked')].map(x=>x.value);if(!ids.length)return alert('Select at least one person');let kind=$('tmpl').value;modal(`<h2>${ids.length} individual Outlook drafts</h2><p class="muted">Open each link separately and send manually.</p>${ids.map(id=>{let p=contacts.find(x=>x.id===id);return `<div class="item"><a target="_blank" rel="noopener noreferrer" href="${escape(mail(p,kind))}">${escape(p.name)} — ${escape(p.email)}</a></div>`}).join('')}`)}if(act==='addRecipients'){let ids=[...document.querySelectorAll('.emailpick:checked')].map(x=>x.value);const {error}=await sb.from('campaign_recipients').upsert(ids.map(contact_id=>({campaign_id:a,contact_id})),{onConflict:'campaign_id,contact_id',ignoreDuplicates:true});if(error)throw error;await load();campaign(a)}if(act==='draft'){let p=contacts.find(x=>x.id===a);window.open(mail(p,c),'_blank','noopener')}if(act==='sent'||act==='replied'){const {error}=await sb.from('campaign_recipients').update({status:act==='sent'?'sent':'replied',updated_at:new Date().toISOString()}).eq('campaign_id',a).eq('contact_id',c);if(error)throw error;await load();campaign(a)}}catch(err){notice(err.message,true)}});auth();})();
